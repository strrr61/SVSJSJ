<!DOCTYPE html>
<html>
<head>
    <title>Airdrop Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Exo+2:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --cyber-purple: #bc00dd;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a2e 0%, #020218 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Exo 2', sans-serif;
        }

        .sky {
            position: relative;
            width: 100vw;
            height: 60vh;
            overflow: hidden;
        }

        /* Pesawat Custom SVG */
        .plane-wrapper {
            position: absolute;
            left: -20%;
            top: 40%;
            width: 250px;
            animation: fly 5s cubic-bezier(0.4,0,0.6,1) infinite;
        }

        .plane {
            filter: drop-shadow(0 0 10px var(--neon-blue));
            transform: rotate(-5deg);
        }

        /* Animasi Airdrop */
        .airdrop {
            position: absolute;
            opacity: 0;
            animation: drop 3s ease-in infinite;
        }

        .parachute {
            width: 50px;
            height: 25px;
            background: rgba(255,255,255,0.95);
            clip-path: polygon(0 0, 100% 0, 80% 100%, 20% 100%);
            position: relative;
            animation: sway 2s ease-in-out infinite;
        }

        .package {
            width: 40px;
            height: 40px;
            background: linear-gradient(45deg, var(--cyber-purple), #ff00ff);
            clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
            position: relative;
            top: -2px;
            left: 5px;
            box-shadow: 0 5px 15px rgba(188,0,221,0.5);
        }

        /* Teks & Tombol */
        .content {
            text-align: center;
            margin-top: 5vh;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 4rem;
            background: linear-gradient(45deg, var(--neon-blue), #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 2rem 0;
            text-shadow: 0 0 30px rgba(0,243,255,0.3);
            animation: text-float 3s ease-in-out infinite;
        }

        .cta-button {
            background: linear-gradient(90deg, var(--cyber-purple) 0%, #4a00e0 100%);
            color: white;
            padding: 1.2rem 3.5rem;
            border-radius: 15px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.4rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 25px rgba(188,0,221,0.4);
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 40px rgba(188,0,221,0.6);
        }

        .cta-button::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, 
                transparent, 
                rgba(255,255,255,0.2), 
                transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        /* Animations */
        @keyframes fly {
            0% { 
                transform: translateX(-100%) rotateY(180deg);
                filter: hue-rotate(0deg);
            }
            100% { 
                transform: translateX(200vw) rotateY(180deg);
                filter: hue-rotate(360deg);
            }
        }

        @keyframes drop {
            0% { opacity: 1; transform: translate(0, -50px); }
            100% { opacity: 1; transform: translate(200px, 80vh); }
        }

        @keyframes sway {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        @keyframes text-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }
    </style>
</head>
<body>
    <div class="sky">
        <div class="plane-wrapper">
            <svg class="plane" viewBox="0 0 100 100" width="250">
                <path d="M20 50 L80 50 L100 70 L80 90 L20 90 L0 70 L20 50" fill="#1a1a1a"/>
                <path d="M30 60 L70 60 L75 65 L70 70 L30 70 L25 65 L30 60" fill="#333"/>
                <path d="M40 30 L60 30 L65 35 L60 40 L40 40 L35 35 L40 30" fill="var(--neon-blue)"/>
                <circle cx="50" cy="50" r="5" fill="#ff0000"/>
                <path d="M15 45 L25 55 L15 65" stroke="var(--neon-blue)" stroke-width="2"/>
            </svg>
        </div>
        
        <div class="airdrop" style="left: 20%">
            <div class="parachute"></div>
            <div class="package"></div>
        </div>
    </div>
    
    <div class="content">
        <h1>AIDROP BERPOTENSI</h1>
        <a href="https://t.me/aidropberpotensi" class="cta-button" target="_blank">
            JOIN TELEGRAM
        </a>
    </div>
</body>
</html>
